name: Keep Render Web App Awake 24/7

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CSU Vehicle Request System
        run: |
          curl -I -s -L --max-time 60 https://csu-vehicle-request.onrender.com/up || true
