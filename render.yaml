services:
  - type: web
    name: pelicle-csulallo
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: PeliCle
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:b0csUkDjXbSebH3/XMh148ORsb1zoV1ARYDtUgnar4M=
      - key: APP_URL
        value: https://pelicle-csulallo.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: daily
      - key: LOG_DAILY_DAYS
        value: "7"
      - key: DB_BUSY_TIMEOUT
        value: "5000"
      - key: DB_JOURNAL_MODE
        value: "wal"
      - key: DB_SYNCHRONOUS
        value: "NORMAL"
      - key: TEXTBEE_API_KEY
        value: "txb_d2nHDE5wmA2oQfDoJLqfdVhGBHZo90dr"
      - key: TEXTBEE_DEVICE_ID
        value: "6ad44dc65291071e57939e85"
